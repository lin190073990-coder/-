name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 找到工程目录
        run: |
          if [ -f QingPing-Android.zip ]; then unzip -q -o QingPing-Android.zip -d _src; fi
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f _src/QingPing/settings.gradle.kts ]; then
            echo "PROJECT_DIR=_src/QingPing" >> "$GITHUB_ENV"
          else
            echo "找不到工程"
            exit 1
          fi

      - name: 构建 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: QingPing-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
